services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - '127.0.0.1:${DEV_PORT:-5173}:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:${DEV_PORT:-5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  node_modules:
